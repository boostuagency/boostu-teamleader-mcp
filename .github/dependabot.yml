version: 2

# Dependabot version updates, volgens dezelfde logica als nextjs-boilerplate en
# strapi-boilerplate: maandelijks, gegroepeerd om de ruis laag te houden, en de
# CI-workflow controleert elke PR.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    # Majors worden NIET geautomatiseerd, voor geen enkel package. Op de harde
    # manier geleerd in nextjs-boilerplate: een gegroepeerde major-update (Next,
    # TypeScript, @types/node, lint-staged) was niet los installeerbaar, en twee
    # zulke PR's samen mergen gaf een package-lock.json die git tekstueel tot
    # ongeldige JSON had samengevoegd, waardoor `npm ci` op main faalde.
    #
    # Minors en patches blijven automatisch. Een major doe je bewust met de hand,
    # op een eigen branch, met de migratiegids open.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
      tooling:
        dependency-type: development
        exclude-patterns:
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Zelfde regel: een major van de base image (bv. node 22 -> 24) doe je met de hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
